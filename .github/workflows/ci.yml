name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forecasting
          POSTGRES_PASSWORD: forecasting
          POSTGRES_DB: forecasting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecasting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # The suite runs on SQLite for speed; this proves the same migrations apply
      # to the engine the service actually deploys against.
      - name: Apply migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://forecasting:forecasting@localhost:5432/forecasting
        run: alembic upgrade head
